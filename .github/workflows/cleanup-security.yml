name: Cleanup Security Tests

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  cleanup-security:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv run --with pytest python -m pytest -q tests/test_genbox_push_cleanup.py
